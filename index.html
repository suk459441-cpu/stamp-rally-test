<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Eco Dystopia Scavenger</title>
    <style>
        /* ==========================================================================
           1. Frutiger Aero × Dystopia 全体デザイン (泡消去・ダーク化)
           ========================================================================== */
        :root {
            /* 明るさを抑え、深海や隔離施設をイメージさせるディストピアグラデーション */
            --bg-gradient: linear-gradient(135deg, #002b49 0%, #005f73 40%, #0a2f1d 80%, #050b05 100%);
            --glass-bg: rgba(5, 20, 30, 0.45);
            --glass-border: rgba(0, 240, 255, 0.25);
            --text-main: #e0f7fa;
            --accent-cyan: #00f0ff;
            --biohazard-yellow: #aacc00;
            --alert-red: #ff3344;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
            overflow-x: hidden;
            position: relative;
        }

        /* ディストピア感を出すための、画面全体のうっすらとした走査線（グリッド）エフェクト */
        body::before {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 9999;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        /* ==========================================================================
           2. サイバーUIパーツ (Glassmorphism + Cyber)
           ========================================================================== */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(0, 240, 255, 0.1);
            width: 100%;
            max-width: 500px;
            padding: 22px;
            margin-bottom: 20px;
            z-index: 2;
            position: relative;
        }

        h2, h3 {
            font-weight: 600;
            letter-spacing: 0.08em;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.5);
        }

        p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #cce7eb;
        }

        /* 光沢感を残しつつ、少し引き締めたサイバーボタン */
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(180deg, rgba(0,180,216,0.5) 0%, rgba(0,77,118,0.6) 100%);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 8px; /* 丸みを少し尖らせてスタイリッシュに */
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3), inset 0 1px 3px rgba(255,255,255,0.2);
            text-decoration: none;
        }
        .btn:active, .btn:hover {
            background: linear-gradient(180deg, rgba(0,240,255,0.7) 0%, rgba(0,119,182,0.8) 100%);
            box-shadow: 0 0 12px rgba(0,240,255,0.5);
            transform: scale(0.99);
        }

        #story-zone, #main-content, #complete-zone {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }

        .biohazard-header {
            color: var(--biohazard-yellow);
            font-size: 0.8rem;
            text-align: center;
            letter-spacing: 0.2em;
            margin-bottom: 12px;
            font-weight: bold;
            text-shadow: 0 0 5px var(--biohazard-yellow);
        }

        .stamp-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .stamp-slot {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: rgba(0, 20, 30, 0.6);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 8px; /* スロットも四角ベースのサイバー感へ */
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .stamp-slot.active {
            border: 1px solid var(--accent-cyan);
            background: rgba(0, 240, 255, 0.1);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4), inset 0 0 5px rgba(0, 240, 255, 0.2);
        }

        .stamp-slot img { width: 85%; height: 85%; object-fit: contain; }
        .stamp-number { font-size: 0.8rem; color: rgba(0,240,255,0.3); font-weight: bold; }

        .notice-box {
            padding: 12px; border-radius: 6px; text-align: center; margin-bottom: 15px;
            font-weight: bold; font-size: 0.9rem; width: 100%; max-width: 500px; z-index: 10;
        }
        .success-notice { background: rgba(10, 80, 50, 0.85); border: 1px solid var(--accent-cyan); color: var(--accent-cyan); }
        .error-notice { background: rgba(120, 20, 20, 0.85); border: 1px solid var(--alert-red); color: #ffcccc; }
        .banner-container { padding: 0; overflow: hidden; border: 1px solid var(--glass-border); }
        .banner-container img { width: 100%; height: auto; display: block; opacity: 0.8; }
    </style>
</head>
<body>

    <div id="notice-container" style="display: none;"></div>

    <div id="story-zone">
        <div class="glass-panel" style="background: rgba(5, 15, 25, 0.9); border: 1px solid var(--accent-cyan);">
            <div class="biohazard-header">⚠️ SYSTEM LINKED / STORY RECORDED ⚠️</div>
            <h3 id="story-title" style="margin-bottom:15px; text-align:center; color: var(--accent-cyan);">QUEST DATA</h3>
            <p id="story-main-text" style="margin-bottom:22px; padding:15px; background:rgba(0,0,0,0.3); border-radius:8px; border-left:4px solid var(--accent-cyan); white-space: pre-wrap;">
                データ展開中...
            </p>
            <button class="btn" id="option-1-btn" onclick="makeChoice(1)" style="margin-bottom: 12px; text-align: left; padding-left: 20px;">❶ 選択肢1</button>
            <button class="btn" id="option-2-btn" onclick="makeChoice(2)" style="text-align: left; padding-left: 20px;">❷ 選択肢2</button>
        </div>
    </div>

    <div id="main-content">
        <div class="glass-panel banner-container">
            <img src="top-banner.png" alt="[ Top Banner ]">
        </div>
        <div class="glass-panel">
            <h2 style="color: var(--accent-cyan); margin-bottom:8px; font-size:1.1rem; text-align:center; letter-spacing: 0.1em;">OPERATING SYSTEM</h2>
            <p id="main-status-text" style="text-align: center; font-size: 0.9rem; color: #8ab4f8;">ステータスを確認中...</p>
        </div>
        <div class="glass-panel">
            <h3 style="font-size:0.95rem; margin-bottom:12px; text-align:center; color: var(--biohazard-yellow);">RECOVERED DATA NODES</h3>
            <div class="stamp-grid">
                <div class="stamp-slot" id="slot-1"><span class="stamp-number">01</span></div>
                <div class="stamp-slot" id="slot-2"><span class="stamp-number">02</span></div>
                <div class="stamp-slot" id="slot-3"><span class="stamp-number">03</span></div>
                <div class="stamp-slot" id="slot-4"><span class="stamp-number">04</span></div>
                <div class="stamp-slot" id="slot-5"><span class="stamp-number">05</span></div>
            </div>
        </div>
    </div>

    <div id="complete-zone">
        <div class="glass-panel" style="border: 1px solid var(--biohazard-yellow); background: rgba(5, 20, 15, 0.95);">
            <div class="biohazard-header">🏁 EXECUTING FINAL SEQUENCE 🏁</div>
            <h2 id="ending-title" style="color: var(--biohazard-yellow); margin-bottom:12px; text-align:center; font-size: 1.3rem;">ENDING</h2>
            <p id="ending-text" style="margin-bottom: 20px; padding: 15px; background:rgba(0,0,0,0.4); border-radius:8px; white-space: pre-wrap; font-size: 0.95rem;"></p>
            <div style="background:rgba(0,0,0,0.3); border-radius:8px; overflow:hidden; margin-bottom:20px; border: 1px solid rgba(255,255,255,0.1);">
                <img id="complete-image" src="" alt="[ Ending Visual ]" style="width:100%; height:auto; display:block;">
            </div>
            <button class="btn" onclick="resetGame()" style="background: linear-gradient(180deg, #cc3333, #660000); border: 1px solid var(--alert-red);">全端末のログを消去して初期化</button>
        </div>
    </div>

    <script>
        const STAMP_IMAGES = { 1: 'stamp1.PNG', 2: 'stamp2.PNG', 3: 'stamp3.PNG', 4: 'stamp4.PNG', 5: 'stamp5.PNG' };

        // ★ ブンジをおどおど、キリコを強気に変更したストーリーテキスト
        const STAMP_STORIES = {
            1: { 
                title: "【第1選択】キャンパス潜入の目的", 
                text: "ゾンビが溢れ返り、死に瀕したキャンパス。何から手をつけるべきか。\n\nブンジ「ウイルスの発生原因を突き止めないと……また同じことが起きるんじゃ、ない、かなぁ……？」\nキリコ「べつに原因も何もないでしょ。誰がゾンビになろうと知ったこっちゃないわ。」", 
                opt1: "❶ ゾンビ化の原因を調べる", 
                opt2: "❷ 治療薬の作り方を調べる" 
            },
            2: { 
                title: "【第2選択】突発的バイオハザード", 
                text: "ここは夢告館。研究棟の奥で、背後からおびただしい数のゾンビが迫る！\n脱出の間際、キリコが足を取られ、自動防壁の向こう側に取り残されてしまった！\n\nキリコ「私に構わず走りなさい！ここで死んだら全部終わりよ！」\nブンジ「ゾンビが来る…！でも、キリコを見捨てるなんて、ぼ、僕にはできないよ……っ！」", 
                opt1: "❶ キリコを助けに戻る", 
                opt2: "❷ キリコを置いていく" 
            },
            3: { 
                title: "【第3選択】立ちはだかる感染者たち", 
                text: "メインラボの入り口を塞ぐのは、かつてこの場所で未来を研究していた同僚たちの変わり果てた姿だった。彼らのサンプルを無傷で採集できれば、データは跳ね上がるが……。\n\nキリコ「…ゾンビはなぜゾンビになったのか。原因がある気がしてきたわ。ここで倒してしまうのが、私たちの正しさなのかしら？麻酔で眠らせて殺さない選択肢もあるんじゃないかしら。」\nブンジ「で、でも、そんなの時間がかかりすぎるよ……！弾を撃ち込んで、最短で突っ切る方が安全だよ……」", 
                opt1: "❶ 麻酔・拘束して進む", 
                opt2: "❷ 倒しながら進む" 
            },
            4: { 
                title: "【第4選択】絶望の感染、そして残された一本", 
                text: "どうにか研究室の最奥まできたあなたたち。そこに立ちはだかる鉛の巨大物体。ゾンビを増やしていたのはこのAIだったのだ。AIの隔離トラップにより、致死性のウイルスガスが部屋に充満した。\n防壁を展開したものの、あなたとブンジの皮膚にはすでに黒い感染斑が浮かび上がっている。\n残された治療薬は、たったの「1人分」。\n\nブンジ「あ、あはは……。やっぱり僕、足手まといだったね……。その薬、君が使いなよ……。ね？」\nキリコ「何バカなこと言ってるのよブンジ！あんたが生きなきゃ日記の暗号が解けないでしょ！？」\n？？？「うおおおおおおお激アツ！どうもpiga!です！！これはね、すくうべきですよ！」", 
                opt1: "❶ ブンジに治療薬を使う", 
                opt2: "❷ 自分に治療薬を使う" 
            },
            5: {
                title: "【最終決戦】マザーAIとの対峙",
                text: "狂った環境管理AIが、警告音を鳴らしながら世界の終焉を告げている。\nすべての選択の答えを携え、アクセスせよ。\n\n（※最終選択肢です）",
                opt1: "▶ AIをたおさない",
                opt2: "▶ AIをぶっ壊す！"
            }
        };

        const ENDING_DATA = {
            "TRUE": { 
                title: "🏆 TRUE END：『AIの贖罪』", 
                text: "【条件：全員生存／AIの目的判明／AIを倒さない】\n\nブンジを救ったあなたは、ブンジがその後ハックしたパソコンから研究者の日記を見つけ、「AIの真の目的」を突き止めた。（ここのパートはちゃんと説明できるよう後で工夫します）3人でAIのコアへ。暴走するシステムに対し、日記に隠されていた切ない真実をアップロードすると、AIは自らのエラー（過ち）を認識し、涙のように火花を散らしながら自爆シーケンスを起動した。\nウイルスは完全に中和。調査団は、崩壊する研究所の屋上から、救助ヘリで爽快に脱出を遂げた！", 
                img: "complete-A.png" 
            },
            "GOOD": { 
                title: "✨ GOOD END：『人類の勝利』", 
                text: "【条件：AIの目的判明／AIを破壊】\n\nAIの真の目的こそ突き止めたものの、仲間の犠牲や決裂を乗り越えてここまで来た。もはや対話の選択肢はない。AIの物理コアを容赦なく叩き潰した！\n世界的なパンデミックは瀬戸際で阻止された。やったね！", 
                img: "complete-A.png" 
            },
            "NORMAL": { 
                title: "🏃‍♂️ NORMAL END：『治療薬』", 
                text: "【条件：完全な治療薬完成／AIを倒せない】\n\nAIの目的は闇に包まれたままで、システムの暴走を完全に止めることは叶わなかった。しかし、キリコの意地が完成させた「完全な治療薬」のデータだけは、ブンジが震える手で死守し通した。\nあなたたちは治療法を世界へ持ち帰るため、ヘリで脱出する。人類の絶滅は免れた。……だが、AIは今でもあの廃墟の奥で、冷徹にゾンビを量産し続けている。", 
                img: "complete-B.png" 
            },
            "BAD": { 
                title: "💀 BAD END：『感染』", 
                text: "【条件：不完全な治療薬、またはAIとの戦闘に敗北】\n\n手元にあるのは不完全なレシピのみ。そうか、完全な治療薬には生きたままのゾンビの細胞が必要だったのか。自分を優先したことでチームは崩壊し、狂いゆく防衛システムに圧倒されてしまった。\nウイルスの浸食が脳を蝕んでいく。なにも聞こえない。遠のく意識のなか、約束されなかった未来の闇へと堕ちていった。", 
                img: "complete-B.png" 
            },
            "WORST": { 
                title: "🚨 WORST END：『人類ゾンビ化計画』", 
                text: "【条件：AIを止められず、治療薬も完成しない】\n\n最悪の選択が重なり、すったもんだあって、治療薬は失われ、AIの暴走を止める術は完全に潰えた。\nいろいろあって狂ったAIは、地球全土に向けて新型ウイルスの大気拡散を開始する。\n人類は絶滅。あとに残されたのは、自我を失い、廃墟を彷徨い続ける不死のゾンビたちだけだった。", 
                img: "complete-B.png" 
            }
        };

        let gameState = { currentStep: 0, collectedSpots: [], choices: {} };

        window.addEventListener('DOMContentLoaded', () => {
            try {
                const savedSpots = localStorage.getItem('v5_z_spots');
                const savedChoices = localStorage.getItem('v5_z_choices');
                const savedStep = localStorage.getItem('v5_z_step');

                if (savedSpots) gameState.collectedSpots = JSON.parse(savedSpots);
                if (savedChoices) gameState.choices = JSON.parse(savedChoices);
                if (savedStep) gameState.currentStep = parseInt(savedStep, 10);
            } catch (e) {
                localStorage.clear();
                gameState = { currentStep: 0, collectedSpots: [], choices: {} };
            }

            processUrlParameter();
            updateScreen();
        });

        function saveStorage() {
            try {
                localStorage.setItem('v5_z_spots', JSON.stringify(gameState.collectedSpots));
                localStorage.setItem('v5_z_choices', JSON.stringify(gameState.choices));
                localStorage.setItem('v5_z_step', gameState.currentStep.toString());
            } catch (e) {}
        }

        function processUrlParameter() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const spotParam = urlParams.get('spot');
                const noticeContainer = document.getElementById('notice-container');
                if (!noticeContainer) return;

                if (spotParam) {
                    const spotNum = parseInt(spotParam, 10);
                    if (spotNum >= 1 && spotNum <= 5) {
                        if (gameState.collectedSpots.includes(spotNum)) return;

                        const expectedNext = gameState.collectedSpots.length + 1;

                        if (spotNum === expectedNext) {
                            gameState.collectedSpots.push(spotNum);
                            saveStorage();
                            noticeContainer.innerHTML = `<div class="notice-box success-notice">⚡ DATA-NODE 0${spotNum}: 接続確立に成功</div>`;
                            noticeContainer.style.display = 'block';
                        } else {
                            noticeContainer.innerHTML = `<div class="notice-box error-notice">⚠️ ACCESS DENIED: ノード 0${expectedNext} を先に同期してください。</div>`;
                            noticeContainer.style.display = 'block';
                        }
                    }
                }
            } catch(err) { console.error(err); }
        }

        function makeChoice(optionNumber) {
            try {
                const currentQuestionId = gameState.collectedSpots.length;
                if (currentQuestionId === 0) return;

                gameState.choices[currentQuestionId] = optionNumber;
                gameState.currentStep = currentQuestionId;
                saveStorage();

                const noticeContainer = document.getElementById('notice-container');
                if (noticeContainer) noticeContainer.style.display = 'none';
                
                window.history.replaceState({}, document.title, window.location.pathname);
                updateScreen();
            } catch(e) { resetGame(); }
        }

        function updateScreen() {
            const storyZone = document.getElementById('story-zone');
            const mainContent = document.getElementById('main-content');
            const completeZone = document.getElementById('complete-zone');

            if (!storyZone || !mainContent || !completeZone) return;

            const totalCollected = gameState.collectedSpots.length;

            if (totalCollected > gameState.currentStep) {
                const storyData = STAMP_STORIES[totalCollected];
                if (storyData) {
                    document.getElementById('story-title').innerText = storyData.title;
                    document.getElementById('story-main-text').innerText = storyData.text;
                    document.getElementById('option-1-btn').innerText = storyData.opt1;
                    document.getElementById('option-2-btn').innerText = storyData.opt2;

                    storyZone.style.display = 'flex';
                    mainContent.style.display = 'none';
                    completeZone.style.display = 'none';
                    return;
                }
            }

            if (totalCollected === 5 && gameState.currentStep === 5) {
                determineEnding();
                storyZone.style.display = 'none';
                mainContent.style.display = 'none';
                completeZone.style.display = 'flex';
                return;
            }

            storyZone.style.display = 'none';
            mainContent.style.display = 'flex';
            completeZone.style.display = 'none';

            const statusTextEl = document.getElementById('main-status-text');
            if (statusTextEl) {
                if (totalCollected === 0) {
                    statusTextEl.innerText = "【待機中】ノード01のQRコードをスキャンし、システムを同期せよ。";
                } else {
                    statusTextEl.innerText = `ノード0${totalCollected}同期完了。次なるターゲット：0${totalCollected + 1} を捕捉中。`;
                }
            }

            for (let i = 1; i <= 5; i++) {
                const slot = document.getElementById(`slot-${i}`);
                if (slot) {
                    if (gameState.collectedSpots.includes(i)) {
                        slot.classList.add('active');
                        slot.innerHTML = `<img src="${STAMP_IMAGES[i]}" alt="Stamp ${i}">`;
                    } else {
                        slot.classList.remove('active');
                        slot.innerHTML = `<span class="stamp-number">0${i}</span>`;
                    }
                }
            }
        }

        function determineEnding() {
            const choice1 = gameState.choices[1];
            const choice2 = gameState.choices[2];
            const choice3 = gameState.choices[3];
            const choice4 = gameState.choices[4];

            let isAllAlive = false;       
            let knowAIPurpose = false;    
            let isPerfectCure = false;    

            if (choice3 === 1) isPerfectCure = true;
            if (choice4 === 1) knowAIPurpose = true;
            if (choice2 === 1 && choice4 === 1) isAllAlive = true;

            let finalEndKey = "WORST";

            if (isAllAlive && knowAIPurpose) {
                finalEndKey = "TRUE";
            } 
            else if (knowAIPurpose && !isAllAlive) {
                finalEndKey = "GOOD";
            } 
            else if (isPerfectCure && !knowAIPurpose) {
                finalEndKey = "NORMAL";
            } 
            else if (!isPerfectCure && choice4 === 2) {
                finalEndKey = "BAD";
            } 
            else {
                finalEndKey = "WORST";
            }

            const finalEnd = ENDING_DATA[finalEndKey];
            if (finalEnd) {
                document.getElementById('ending-title').innerText = finalEnd.title;
                document.getElementById('ending-text').innerText = finalEnd.text;
                document.getElementById('complete-image').src = finalEnd.img;
            }
        }

        function resetGame() {
            localStorage.clear();
            window.location.href = window.location.pathname;
        }
    </script>
</body>
</html>
