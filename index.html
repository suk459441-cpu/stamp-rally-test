<script>
        // 定数定義 (画像ファイル名指定)
        const STAMP_IMAGES = {
            1: 'stamp1.PNG',
            2: 'stamp2.PNG',
            3: 'stamp3.PNG',
            4: 'stamp4.PNG',
            5: 'stamp5.PNG'
        };

        // ルートごとの表示テキスト定義
        const ROUTE_DATA = {
            'A': {
                title: 'ルートA：抗ウイルス薬確保ミッション',
                desc: 'キリコ「生存者のためにも、まずは薬の確保が最優先よ。施設内の5つのラボラトリーを巡り、研究データをサルベージしましょう！」'
            },
            'B': {
                title: 'ルートB：パンデミック原因究明ミッション',
                desc: 'ブンジ「この感染は仕組まれたものだ…。キャンパスのメインサーバーに残された5つのログを解析し、ウイルスの発生源を突き止めるぞ。」'
            }
        };

        // アプリケーションの状態
        let gameState = {
            chosenRoute: null,
            collectedSpots: []
        };

        // ページ読み込み時の初期化処理
        window.addEventListener('DOMContentLoaded', () => {
            try {
                loadStorage();
                processUrlParameter();
                updateUI();
            } catch (error) {
                console.error("Initialization Error: ", error);
                // 万が一エラーが出ても、強制的に初期選択画面だけは表示させる
                document.getElementById('story-overlay').style.display = 'flex';
                document.getElementById('main-content').style.display = 'none';
            }
        });

        // 1. ローカルストレージから状態を復元
        function loadStorage() {
            try {
                const savedRoute = localStorage.getItem('zombie_rally_route');
                const savedSpots = localStorage.getItem('zombie_rally_spots');

                if (savedRoute && (savedRoute === 'A' || savedRoute === 'B')) {
                    gameState.chosenRoute = savedRoute;
                }
                if (savedSpots) {
                    const parsed = JSON.parse(savedSpots);
                    if (Array.isArray(parsed)) {
                        gameState.collectedSpots = parsed;
                    }
                }
            } catch (e) {
                console.error("Storage load failed, clearing logic...", e);
                localStorage.clear(); // 破損データ対策で一度クリア
            }
        }

        // 2. URLパラメータ (?spot=X) の解析とスタンプ付与
        function processUrlParameter() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const spotParam = urlParams.get('spot');

                if (spotParam) {
                    const spotNum = parseInt(spotParam, 10);
                    if (spotNum >= 1 && spotNum <= 5) {
                        if (!gameState.collectedSpots.includes(spotNum)) {
                            gameState.collectedSpots.push(spotNum);
                            localStorage.setItem('zombie_rally_spots', JSON.stringify(gameState.collectedSpots));
                        }
                        
                        const noticeEl = document.getElementById('spot-notification');
                        if (noticeEl) {
                            noticeEl.innerHTML = `<div class="toast-notice">▶ スポット 0${spotNum} のデータチェックインに成功！</div>`;
                            noticeEl.style.display = 'block';
                        }
                    }
                }
            } catch (e) {
                console.error("URL Parameter processing failed: ", e);
            }
        }

        // 3. ルート選択が行われたときの処理
        function selectRoute(route) {
            gameState.chosenRoute = route;
            localStorage.setItem('zombie_rally_route', route);
            
            const overlay = document.getElementById('story-overlay');
            overlay.style.transition = 'opacity 0.3s ease';
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
                updateUI();
            }, 300);
        }

        // 4. 画面全体の表示更新処理
        function updateUI() {
            const overlayEl = document.getElementById('story-overlay');
            const mainContentEl = document.getElementById('main-content');

            // ルート未選択時の安全な表示切り替え
            if (!gameState.chosenRoute) {
                if (overlayEl) overlayEl.style.display = 'flex';
                if (mainContentEl) mainContentEl.style.display = 'none';
                return;
            } else {
                if (overlayEl) overlayEl.style.display = 'none';
                if (mainContentEl) mainContentEl.style.display = 'flex';
            }

            // テキストの書き換え
            const currentRouteInfo = ROUTE_DATA[gameState.chosenRoute];
            if (currentRouteInfo) {
                const titleEl = document.getElementById('route-title');
                const descEl = document.getElementById('route-desc');
                if (titleEl) titleEl.innerText = currentRouteInfo.title;
                if (descEl) descEl.innerText = currentRouteInfo.desc;
            }

            // スタンプスロットの描画更新
            for (let i = 1; i <= 5; i++) {
                const slot = document.getElementById(`slot-${i}`);
                if (slot) {
                    if (gameState.collectedSpots.includes(i)) {
                        slot.classList.add('active');
                        slot.innerHTML = `<img src="${STAMP_IMAGES[i]}" alt="Stamp ${i}">`;
                    } else {
                        slot.classList.remove('active');
                        slot.innerHTML = `<span class="stamp-number">0${i}</span>`;
                    }
                }
            }

            // コンプリート判定
            const completeZone = document.getElementById('complete-zone');
            if (completeZone) {
                if (gameState.collectedSpots.length === 5) {
                    const completeImg = document.getElementById('complete-image');
                    if (completeImg) {
                        completeImg.src = gameState.chosenRoute === 'A' ? 'complete-A.png' : 'complete-B.png';
                    }
                    completeZone.style.display = 'block';
                } else {
                    completeZone.style.display = 'none';
                }
            }
        }

        // リセット機能
        function resetGame() {
            if (confirm('すべての進行状況と選択したルートをリセットします。よろしいですか？')) {
                localStorage.clear();
                gameState.chosenRoute = null;
                gameState.collectedSpots = [];
                window.location.href = window.location.pathname;
            }
        }
    </script>
