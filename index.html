<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Scavenger Hunt</title>
    <style>
        /* ==========================================================================
           1. 全体・背景デザイン (Frutiger Aero Zombie Apocalypse)
           ========================================================================== */
        :root {
            --bg-gradient: linear-gradient(135deg, #0d1b2a 0%, #003049 40%, #d8f3dc 100%);
            --glass-bg: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-main: #f8f9fa;
            --accent-blue: #00b4d8;
            --accent-green: #40916c;
            --biohazard-yellow: #ccff00;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
            overflow-x: hidden;
            position: relative;
        }

        /* 擬似的なバイオハザード・光沢エフェクトの背景装飾 */
        body::before {
            content: "";
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(0,180,216,0.1) 0%, rgba(64,145,108,0.05) 50%, transparent 100%);
            pointer-events: none;
            z-index: 0;
        }

        /* ==========================================================================
           2. 共通コンポーネント (Glassmorphism UI)
           ========================================================================== */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            width: 100%;
            max-width: 500px;
            padding: 20px;
            margin-bottom: 20px;
            z-index: 1;
            position: relative;
        }

        h1, h2, h3 {
            text-align: center;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #e0e1dd;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, rgba(0,180,216,0.6) 0%, rgba(64,145,108,0.6) 100%);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 30px;
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,180,216,0.2);
        }

        .btn:hover {
            background: linear-gradient(135deg, rgba(0,180,216,0.8) 0%, rgba(64,145,108,0.8) 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(204,255,0,0.3);
        }

        /* ==========================================================================
           3. ストーリー選択画面 (初期オーバーレイ)
           ========================================================================== */
        #story-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 25, 30, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .story-box {
            max-width: 450px;
            border: 2px solid rgba(0,180,216,0.3);
            background: rgba(15, 32, 39, 0.85);
        }

        .biohazard-alert {
            color: var(--biohazard-yellow);
            font-size: 0.8rem;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .story-text {
            margin-bottom: 25px;
            padding: 15px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            border-left: 4px solid var(--accent-blue);
        }

        .option-btn {
            margin-bottom: 12px;
            text-align: left;
            padding-left: 20px;
            position: relative;
        }

        /* ==========================================================================
           4. メインコンテンツ画面
           ========================================================================== */
        #main-content {
            display: none; /* ストーリー選択後にJSで表示 */
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .banner-container img, .map-container img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
        }

        .banner-container {
            padding: 0;
            overflow: hidden;
            border: 1px solid var(--glass-border);
        }

        .dynamic-title {
            color: #fff;
            text-shadow: 0 0 10px rgba(0,180,216,0.6);
            margin-bottom: 10px;
            font-size: 1.5rem;
        }

        .dynamic-desc {
            font-size: 0.9rem;
            text-align: center;
        }

        /* スタンプラリーのグリッド配置 */
        .stamp-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            justify-items: center;
            margin-top: 15px;
        }

        /* 4番目と5番目を中央寄せにするための調整 */
        .stamp-grid .stamp-slot:nth-child(4) {
            grid-column: 1 / 2;
        }
        @media (min-width: 320px) {
            .stamp-grid {
                grid-template-columns: repeat(6, 1fr);
            }
            .stamp-slot:nth-child(1) { grid-column: 1 / 3; }
            .stamp-slot:nth-child(2) { grid-column: 3 / 5; }
