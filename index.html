<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>謎解きスタンプラリー2026 - 博士の夢見たゾンビの楽園</title>
    <style>
        /* ==========================================================================
           1. UI/UX基本構造 & バックグラウンドデザイン
           ========================================================================== */
        :root {
            --bg-dark: #050a07;
            --main-green: #1f3a29;
            --accent-green: #4af685;
            --rust-brown: #5c3a21;
            --text-light: #d8e6dd;
            --text-dim: #7a9485;
            --glass-bg: rgba(8, 16, 11, 0.85);
            --glass-border: rgba(74, 246, 133, 0.3);
            --alert-red: #ff4757;
            --warning-yellow: #eccc68;
            --font-mono: 'Courier New', Consolas, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            background-image: 
                radial-gradient(circle at 50% 30%, rgba(42, 77, 54, 0.4) 0%, transparent 70%),
                linear-gradient(rgba(74, 246, 133, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(74, 246, 133, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            background-attachment: fixed;
            animation: bgShift 20s infinite linear;
        }

        @keyframes bgShift {
            0% { background-position: 0 0, 0 0, 0 0; }
            100% { background-position: 0 0, 0 300px, 300px 0; }
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
            opacity: 0.7;
        }

        #app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 2;
            background: rgba(5, 10, 7, 0.75);
            border-left: 1px solid var(--glass-border);
            border-right: 1px solid var(--glass-border);
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
            padding-bottom: 70px;
        }

        /* ==========================================================================
           2. UIパーツ & コンポーネント
           ========================================================================== */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            padding: 16px;
            margin: 12px;
            position: relative;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px;
            background: rgba(42, 77, 54, 0.5);
            border: 1px solid var(--accent-green);
            border-radius: 6px;
            color: var(--text-light);
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            margin-top: 8px;
            box-shadow: inset 0 0 10px rgba(74, 246, 133, 0.1);
        }

        .btn:active {
            transform: scale(0.98);
            background: var(--accent-green);
            color: var(--bg-dark);
        }

        .btn-danger {
            border-color: var(--alert-red);
            background: rgba(255, 71, 87, 0.2);
            color: #ff8892;
        }

        .btn-danger:active {
            background: var(--alert-red);
            color: #fff;
        }

        header {
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(4, 8, 6, 0.9);
        }

        .terminal-status {
            font-size: 0.75rem;
            font-family: var(--font-mono);
            color: var(--accent-green);
        }

        .audio-btn {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-light);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 480px;
            height: 60px;
            background: rgba(7, 13, 10, 0.95);
            border-top: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-dim);
            font-size: 0.65rem;
            text-decoration: none;
            cursor: pointer;
            background: none;
            border: none;
            width: 25%;
        }

        .nav-item.active {
            color: var(--accent-green);
        }

        .nav-icon {
            font-size: 1.2rem;
            margin-bottom: 2px;
        }

        .view {
            display: none;
            flex-direction: column;
            width: 100%;
            animation: fadeIn 0.3s ease;
        }

        .view.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* QR読み取り時のスキャンエフェクト overlay */
        #scan-effect-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(74, 246, 133, 0.15);
            z-index: 9999;
            pointer-events: none;
            display: none;
            border: 4px solid var(--accent-green);
            box-shadow: inset 0 0 50px rgba(74, 246, 133, 0.5);
            animation: pulseScan 0.8s ease-out forwards;
        }

        @keyframes pulseScan {
            0% { opacity: 0; transform: scale(1.05); }
            30% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; }
        }

        /* ==========================================================================
           3. 各画面スタイル
           ========================================================================== */
        /* 丸枠を削除し、上に詰めたTOP画面構造 */
        #view-top {
            position: relative;
            min-height: calc(100vh - 130px);
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding: 30px 20px;
            text-align: center;
            gap: 25px;
        }

        .sub-title {
            font-size: 0.85rem;
            color: var(--accent-green);
            letter-spacing: 0.2em;
            margin-bottom: 8px;
            font-family: var(--font-mono);
        }

        .main-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(74, 246, 133, 0.5);
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 12px;
            padding-bottom: 20px;
        }

        .chat-bubble {
            display: flex;
            gap: 10px;
            max-width: 90%;
            animation: fadeIn 0.2s ease;
        }

        .chat-bubble.player {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .chat-avatar {
            width: 38px;
            height: 38px;
            border-radius: 6px;
            background: #1e3325;
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .chat-content {
            background: rgba(20, 35, 25, 0.9);
            border: 1px solid rgba(74, 246, 133, 0.2);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            line-height: 1.4;
        }

        .chat-bubble.player .chat-content {
            background: rgba(42, 77, 54, 0.7);
            border-color: var(--accent-green);
        }

        .chat-sender {
            font-size: 0.7rem;
            color: var(--accent-green);
            margin-bottom: 3px;
            font-family: var(--font-mono);
        }

        .system-msg {
            text-align: center;
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--warning-yellow);
            background: rgba(236, 204, 104, 0.1);
            border: 1px dashed var(--warning-yellow);
            padding: 8px;
            border-radius: 4px;
            margin: 8px 0;
            line-height: 1.4;
        }

        .next-guide-msg {
            text-align: center;
            font-weight: bold;
            font-size: 0.9rem;
            color: var(--accent-green);
            background: rgba(74, 246, 133, 0.15);
            border: 1px solid var(--accent-green);
            padding: 12px;
            border-radius: 6px;
            margin: 12px;
            box-shadow: 0 0 10px rgba(74, 246, 133, 0.2);
            animation: fadeIn 0.4s ease;
        }

        .choice-box {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px;
            background: rgba(0,0,0,0.85);
            border-top: 1px solid var(--glass-border);
            position: sticky;
            bottom: 60px;
            z-index: 10;
        }

        .stamp-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 10px 0;
        }

        .stamp-card {
            aspect-ratio: 1;
            background: rgba(10, 20, 15, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .stamp-card.acquired {
            border-color: var(--accent-green);
            background: rgba(74, 246, 133, 0.15);
        }

        .stamp-mark {
            font-size: 2rem;
            opacity: 0.2;
        }

        .stamp-card.acquired .stamp-mark {
            opacity: 1;
            transform: scale(1.1) rotate(-5deg);
        }

        .stamp-label {
            font-size: 0.65rem;
            margin-top: 4px;
            color: var(--text-dim);
            font-family: var(--font-mono);
        }

        .ending-card {
            border: 1px solid var(--glass-border);
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 6px;
            background: rgba(5, 12, 8, 0.5);
        }

        .ending-card.discovered {
            border-color: var(--accent-green);
            background: rgba(42, 77, 54, 0.25);
        }
    </style>
</head>

    <script>
        /* ==========================================================================
           Web Audio API 音声機能 & SE演出
           ========================================================================== */
        let audioCtx = null;
        let isAudioOn = false;
        let bgmTimer = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTapSound() {
            initAudio();
            if (!isAudioOn) {
                isAudioOn = true;
                const btn = document.getElementById('audio-toggle');
                if (btn) btn.innerText = "🔊 BGM ON";
                startMelodicBGM();
            }

            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        document.addEventListener('click', (e) => {
            initAudio();
            if (e.target.tagName === 'BUTTON' || e.target.closest('button')) {
                playTapSound();
            }
        });

        function toggleAudio() {
            initAudio();
            const btn = document.getElementById('audio-toggle');
            if (isAudioOn) {
                stopMelodicBGM();
                btn.innerText = "🔊 BGM OFF";
                isAudioOn = false;
            } else {
                isAudioOn = true;
                btn.innerText = "🔊 BGM ON";
                startMelodicBGM();
            }
        }

        function startMelodicBGM() {
            if (!audioCtx || !isAudioOn) return;
            stopMelodicBGM();

            const notes = [
                220.00, 261.63, 293.66, 329.63, 261.63, 220.00, 196.00, 220.00,
                220.00, 261.63, 329.63, 392.00, 329.63, 293.66, 261.63, 220.00,
                174.61, 220.00, 261.63, 293.66, 261.63, 220.00, 174.61, 196.00
            ];
            let noteIdx = 0;

            function playNextNote() {
                if (!isAudioOn) return;

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(notes[noteIdx], audioCtx.currentTime);

                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.28);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.28);

                noteIdx = (noteIdx + 1) % notes.length;
                bgmTimer = setTimeout(playNextNote, 220);
            }

            playNextNote();
        }

        function stopMelodicBGM() {
            if (bgmTimer) clearTimeout(bgmTimer);
        }

        function playSE(type) {
            initAudio();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'stamp') {
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1046.50, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } else if (type === 'scan') {
                // QR読み取り用スキャン効果音（サイバー感のある近未来サウンド）
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        const DIALOGUES_LOOP2 = {
            1: [
                { sender: "キリコ", text: "……あれ？デジャブかしら。私、前にもここに来た気が……" },
                { sender: "ブンジ", text: "……フフ、気のせいですよキリコさん。『指示役（システム）』のログ通りに進みましょう。" }
            ],
            2: [
                { sender: "ブンジ", text: "迷う必要はありません。僕の画面に『指示役AI』からの最適解が表示されています。" },
                { sender: "キリコ", text: "ブンジ……あなた、さっきから誰と通信してるの？" }
            ],
            3: [
                { sender: "ブンジ", text: "……かつてこのラボで研究をしていた僕の兄さんも言っていました。AIの導きこそが『楽園』への近道だと。" },
                { sender: "キリコ", text: "あなたの兄……？まさか、この実験の！？" }
            ],
            4: [
                { sender: "ブンジ", text: "もう隠す必要もありませんね。僕はただのハッカーですが、裏で『学園統括AI』と繋がっていたんです。" },
                { sender: "キリコ", text: "なんですって！？じゃあ、私たちをここに誘い込んだのは……！" }
            ],
            5: [
                { sender: "指示役AI", text: "「警告。全観測データの収集を完了しました。私は学園を統括するAIプロトコルです。」" },
                { sender: "ブンジ", text: "僕のハッキング技術と指示役AIの演算力があれば、ループ実験は完成する……！" },
                { sender: "指示役AI", text: "「プレイヤー様。すべてのチェックポイントを監査しました。選択の時です。」" }
            ]
        };

        const CHOICES_DATA = {
            2: {
                question: "【選択1】調査の優先方針は？",
                options: [
                    { label: "A: ウイルスの発生原因を究明する", value: "A" },
                    { label: "B: 治療薬のデータを最優先で探す", value: "B" }
                ]
            },
            3: {
                question: "【選択2】防壁の向こうのキリコに対して",
                options: [
                    { label: "A: 危険を冒して救出に戻る", value: "A" },
                    { label: "B: 任務のため置いて先を急ぐ", value: "B" }
                ]
            },
            4: {
                question: "【選択3】感染した研究員の群れへの対応",
                options: [
                    { label: "A: 麻酔・拘束して無傷で進む", value: "A" },
                    { label: "B: 倒しながら最短で突っ切る", value: "B" }
                ]
            }
        };

        /* ==========================================================================
           状態管理 (localStorage)
           ========================================================================== */
        let state = {
            loopCount: 1,
            stamps: [],
            currentChoices: [],
            discoveredEndings: [],
            currentSpot: 0
        };

        function loadState() {
            const saved = localStorage.getItem('mystery_game_save');
            if (saved) {
                try { state = { ...state, ...JSON.parse(saved) }; } catch(e){}
            }
            updateHeader();
        }

        function saveState() {
            localStorage.setItem('mystery_game_save', JSON.stringify(state));
            updateHeader();
        }

        function updateHeader() {
            document.getElementById('sys-loop').innerText = `LOOP: ${state.loopCount}`;
            document.getElementById('sys-status').innerText = `STAMPS: ${state.stamps.length}/5`;
        }

        function switchView(viewName, navEl) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById(`view-${viewName}`).classList.add('active');
            if (navEl) navEl.classList.add('active');

            if (viewName === 'stamps') renderStamps();
            if (viewName === 'endings') renderEndings();
        }

        function startInvestigation() {
            initAudio();
            if (!state.stamps.includes(1)) {
                acquireStamp(1);
            } else {
                state.currentSpot = 1;
                loadStorySpot(1);
            }
            switchView('story', document.querySelectorAll('.nav-item')[1]);
        }

        /* 順番通りの読み込み制限判定 & QRスキャン演出 */
        function processUrlParams() {
            const params = new URLSearchParams(window.location.search);
            const stampParam = params.get('stamp') || params.get('spot');
            if (stampParam) {
                const id = parseInt(stampParam, 10);
                if (id >= 1 && id <= 5) {
                    triggerScanEffect(); // QRスキャン演出発動

                    const expectedNext = state.stamps.length + 1;
                    if (id === expectedNext || state.stamps.includes(id)) {
                        acquireStamp(id);
                        switchView('story', document.querySelectorAll('.nav-item')[1]);
                    } else {
                        alert(`【警告】順番が違います！\n先にチェックポイント 0${expectedNext} を読み込んでください。`);
                        switchView('story', document.querySelectorAll('.nav-item')[1]);
                        document.getElementById('chat-box').innerHTML = `
                            <div class="system-msg">
                                【エラー】正しい順番でQRコードを読み込んでください。<br>
                                次に探すべきチェックポイント: 0${expectedNext}
                            </div>
                        `;
                        document.getElementById('chat-controls').style.display = 'none';
                        document.getElementById('next-guide-container').style.display = 'block';
                    }
                }
            }
        }

        function triggerScanEffect() {
            playSE('scan');
            const overlay = document.getElementById('scan-effect-overlay');
            if (overlay) {
                overlay.style.display = 'block';
                setTimeout(() => { overlay.style.display = 'none'; }, 800);
            }
        }

        function acquireStamp(id) {
            if (!state.stamps.includes(id)) {
                state.stamps.push(id);
                playSE('stamp');
                saveState();
            }
            state.currentSpot = id;
            loadStorySpot(id);
        }

        function renderStamps() {
            for (let i = 1; i <= 5; i++) {
                const el = document.getElementById(`stamp-${i}`);
                if (state.stamps.includes(i)) {
                    el.classList.add('acquired');
                } else {
                    el.classList.remove('acquired');
                }
            }
        }

        /* ==========================================================================
           会話・ストーリー・エンディング進行ロジック
           ========================================================================== */
        let currentDialogueList = [];
        let dialogueIndex = 0;

        function loadStorySpot(spotId) {
            document.getElementById('story-location-tag').innerText = `CHECKPOINT 0${spotId} LOGS`;
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = '';
            dialogueIndex = 0;

            if (state.loopCount >= 2) {
                currentDialogueList = DIALOGUES_LOOP2[spotId] || [];
            } else {
                currentDialogueList = DIALOGUES[spotId] || [];
            }

            document.getElementById('choice-container').style.display = 'none';
            document.getElementById('next-guide-container').style.display = 'none';
            document.getElementById('chat-controls').style.display = 'block';

            advanceDialogue();
        }

        function advanceDialogue() {
            const chatBox = document.getElementById('chat-box');

            if (dialogueIndex < currentDialogueList.length) {
                const msg = currentDialogueList[dialogueIndex];
                
                if (msg.sender === "システム" || msg.sender === "指示役AI") {
                    const sysDiv = document.createElement('div');
                    sysDiv.className = 'system-msg';
                    sysDiv.innerText = `${msg.sender === '指示役AI' ? '【指示役AI】' : ''}${msg.text}`;
                    chatBox.appendChild(sysDiv);
                } else {
                    const bubble = document.createElement('div');
                    bubble.className = `chat-bubble ${msg.sender === 'プレイヤー' ? 'player' : ''}`;
                    
                    const avatarMap = { "キリコ": "👩‍🔬", "ブンジ": "👨‍💻", "指示役AI": "🤖", "プレイヤー": "👤" };
                    
                    bubble.innerHTML = `
                        <div class="chat-avatar">${avatarMap[msg.sender] || '💬'}</div>
                        <div>
                            <div class="chat-sender">${msg.sender}</div>
                            <div class="chat-content">${msg.text}</div>
                        </div>
                    `;
                    chatBox.appendChild(bubble);
                }

                dialogueIndex++;
                window.scrollTo(0, document.body.scrollHeight);
            } else {
                document.getElementById('chat-controls').style.display = 'none';
                
                // 1周目処理
                if (state.loopCount === 1) {
                    if (CHOICES_DATA[state.currentSpot]) {
                        showChoices(CHOICES_DATA[state.currentSpot]);
                    } else if (state.currentSpot === 5) {
                        // ② ログ会話が終わった後にボタンを表示してエンディング画面へ移動
                        showEndingTransitionBtn();
                    } else {
                        document.getElementById('next-guide-container').style.display = 'block';
                    }
                } else {
                    // 2周目処理
                    if (state.currentSpot >= 2 && state.currentSpot <= 4) {
                        showSingleChoice(state.currentSpot);
                    } else if (state.currentSpot === 5) {
                        showFinalAiChoices();
                    } else {
                        document.getElementById('next-guide-container').style.display = 'block';
                    }
                }
            }
        }

        function showChoices(choiceData) {
            const container = document.getElementById('choice-container');
            container.innerHTML = `<div style="font-size:0.85rem; color:var(--warning-yellow); margin-bottom:6px; font-weight:bold;">${choiceData.question}</div>`;

            choiceData.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = opt.label;
                btn.onclick = () => selectOption(opt.value);
                container.appendChild(btn);
            });

            container.style.display = 'flex';
        }

        function selectOption(val) {
            state.currentChoices.push(val);
            saveState();
            document.getElementById('choice-container').style.display = 'none';
            document.getElementById('next-guide-container').style.display = 'block';
        }

        function showSingleChoice(spotId) {
            const container = document.getElementById('choice-container');
            container.innerHTML = `<div style="font-size:0.85rem; color:var(--accent-green); margin-bottom:6px;">【指示役AI】の誘導に従いますか？</div>`;

            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = "指示通りに進行する";
            btn.onclick = () => {
                container.style.display = 'none';
                document.getElementById('next-guide-container').style.display = 'block';
            };
            container.appendChild(btn);
            container.style.display = 'flex';
        }

        // ② クリア後会話ログ完了時に表示する遷移ボタン
        function showEndingTransitionBtn() {
            const container = document.getElementById('choice-container');
            container.innerHTML = `<div style="font-size:0.85rem; color:var(--accent-green); margin-bottom:6px; text-align:center;">全ログの検証完了</div>`;

            const btn = document.createElement('button');
            btn.className = 'btn';
            btn.innerText = "クリアしてエンディングを見る ▶";
            btn.onclick = () => resolveNormalEnding();
            container.appendChild(btn);
            container.style.display = 'flex';
        }

        function resolveNormalEnding() {
            const key = state.currentChoices.join('');
            const endData = ENDING_MASTER[key] || ENDING_MASTER["AAA"];
            
            if (!state.discoveredEndings.includes(endData.id)) {
                state.discoveredEndings.push(endData.id);
            }

            // 次の周（2周目）への準備
            state.loopCount = 2;
            state.stamps = [];
            state.currentChoices = [];
            saveState();

            switchView('endings', document.querySelectorAll('.nav-item')[3]);
            alert(`【エンディング到達】\n${endData.name}\n\n※2周目のロックが解除されました。周回して真相に迫ってください。`);
        }

        function showFinalAiChoices() {
            const container = document.getElementById('choice-container');
            container.innerHTML = `<div style="font-size:0.85rem; color:var(--alert-red); margin-bottom:6px; font-weight:bold;">【最終決断】指示役AIと学園の運命は？</div>`;

            const btn1 = document.createElement('button');
            btn1.className = 'btn';
            btn1.innerText = "1. AIシステムを破壊し、学園を解放する";
            btn1.onclick = () => resolveAiEnding("AI_DESTROY");

            const btn2 = document.createElement('button');
            btn2.className = 'btn btn-danger';
            btn2.innerText = "2. AIを暴走・自爆させ全ての記録を消し去る";
            btn2.onclick = () => resolveAiEnding("AI_SELF_DESTRUCT");

            container.appendChild(btn1);
            container.appendChild(btn2);
            container.style.display = 'flex';
        }

        function resolveAiEnding(endingType) {
            const endData = ENDING_MASTER[endingType];
            if (!state.discoveredEndings.includes(endData.id)) {
                state.discoveredEndings.push(endData.id);
            }
            saveState();

            switchView('endings', document.querySelectorAll('.nav-item')[3]);
            alert(`【TRUE ENDING 到達】\n${endData.name}\n${endData.desc}`);
        }

        function renderEndings() {
            const container = document.getElementById('endings-list');
            container.innerHTML = '';

            Object.keys(ENDING_MASTER).forEach(k => {
                const end = ENDING_MASTER[k];
                const isFound = state.discoveredEndings.includes(end.id);

                const card = document.createElement('div');
                card.className = `ending-card ${isFound ? 'discovered' : ''}`;
                card.innerHTML = `
                    <div style="font-size:0.7rem; color:var(--text-dim); font-family:var(--font-mono);">${end.id}</div>
                    <div style="font-weight:bold; font-size:0.95rem; margin:2px 0; color:${isFound ? 'var(--accent-green)' : 'var(--text-dim)'};">
                        ${isFound ? end.name : '？？？？？？？？'}
                    </div>
                    <div style="font-size:0.75rem; color:var(--text-dim);">${isFound ? end.desc : '未到達のマルチエンディングログです。'}</div>
                `;
                container.appendChild(card);
            });
        }

        function confirmReset() {
            if (confirm("端末の全データおよび到達エンディングを初期化しますか？")) {
                localStorage.removeItem('mystery_game_save');
                state = { loopCount: 1, stamps: [], currentChoices: [], discoveredEndings: [], currentSpot: 0 };
                saveState();
                location.reload();
            }
        }

        // 初期化実行
        window.onload = () => {
            loadState();
            processUrlParams();
        };
    </script>
</body>
</html>
