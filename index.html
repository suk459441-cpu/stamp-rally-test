<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Eco Cyber Scavenger</title>
    <style>
        /* ==========================================================================
           1. Frutiger Aero Zombie Apocalypse 全体デザイン
           ========================================================================== */
        :root {
            /* 水、植物、未来、不穏を融合させた鮮やかなグラデーション */
            --bg-gradient: linear-gradient(135deg, #0077b6 0%, #00b4d8 30%, #52b788 70%, #112211 100%);
            --glass-bg: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.3);
            --text-main: #ffffff;
            --accent-cyan: #00f0ff;
            --biohazard-yellow: #ccff00;
            --alert-red: #ff3333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
            overflow-x: hidden;
            position: relative;
        }

        /* Frutiger Aero特有の「泡・シャボン玉」の浮遊演出 */
        .bubbles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }
        .bubble {
            position: absolute;
            bottom: -50px;
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5), inset 0 0 10px rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: rise 12s infinite linear;
        }
        @keyframes rise {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-110vh) scale(1.2); opacity: 0; }
        }

        /* ==========================================================================
           2. 近未来的ですっきりしたUIパーツ (Glassmorphism)
           ========================================================================== */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 80, 100, 0.25), inset 0 0 20px rgba(255,255,255,0.1);
            width: 100%;
            max-width: 500px;
            padding: 22px;
            margin-bottom: 20px;
            z-index: 1;
            position: relative;
        }

        h1, h2, h3 {
            font-weight: 600;
            letter-spacing: 0.05em;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #ffffff;
        }

        /* Aeroテイストの光沢感あるボタン */
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(180deg, rgba(0,240,255,0.7) 0%, rgba(0,119,182,0.7) 100%);
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 30px;
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,180,216,0.3), inset 0 2px 4px rgba(255,255,255,0.4);
            text-decoration: none;
        }
        .btn:active, .btn:hover {
            background: linear-gradient(180deg, rgba(0,240,255,0.9) 0%, rgba(0,180,216,0.9) 100%);
            transform: scale(0.98);
            box-shadow: 0 2px 8px rgba(0,240,255,0.5);
        }

        /* ==========================================================================
           3. 各種画面セクションの制御
           ========================================================================== */
        #story-zone, #main-content, #complete-zone {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }

        .biohazard-header {
            color: var(--biohazard-yellow);
            font-size: 0.8rem;
            text-align: center;
            letter-spacing: 0.15em;
            margin-bottom: 12px;
            font-weight: bold;
        }

        /* スタンプラリーのグリッド配置 (5個一列) */
        .stamp-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .stamp-slot {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: rgba(0, 40, 60, 0.4);
            border: 2px dashed rgba(255,255,255,0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
        }

        .stamp-slot.active {
            border: 2px solid var(--accent-cyan);
            background: rgba(0, 240, 255, 0.15);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.6), inset 0 0 8px rgba(255,255,255,0.3);
        }

        .stamp-slot img {
            width: 85%;
            height: 85%;
            object-fit: contain;
        }

        .stamp-number {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.4);
            font-weight: bold;
        }

        /* 警告・通知デザイン */
        .notice-box {
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 0.9rem;
            width: 100%;
            max-width: 500px;
            z-index: 1;
        }
        .success-notice { background: rgba(82, 183, 136, 0.85); border: 1px solid var(--biohazard-yellow); }
        .error-notice { background: rgba(255, 51, 51, 0.85); border: 1px solid #ff9999; }

        .banner-container {
            padding: 0;
            overflow: hidden;
            border: 1px solid var(--glass-border);
        }
        .banner-container img { width: 100%; height: auto; display: block; }
    </style>
</head>
<body>

    <div class="bubbles">
        <div class="bubble" style="left: 10%; width: 30px; height: 30px; animation-delay: 0s; animation-duration: 8s;"></div>
        <div class="bubble" style="left: 30%; width: 15px; height: 15px; animation-delay: 2s; animation-duration: 11s;"></div>
        <div class="bubble" style="left: 55%; width: 45px; height: 45px; animation-delay: 1s; animation-duration: 14s;"></div>
        <div class="bubble" style="left: 70%; width: 20px; height: 20px; animation-delay: 5s; animation-duration: 9s;"></div>
        <div class="bubble" style="left: 85%; width: 35px; height: 35px; animation-delay: 3s; animation-duration: 12s;"></div>
    </div>

    <div id="notice-container" style="display: none;"></div>

    <div id="story-zone">
        <div class="glass-panel" style="background: rgba(10, 35, 45, 0.85); border: 2px solid var(--accent-cyan);">
            <div class="biohazard-header" id="story-alert-text">⚠️ MISSION ONGOING ⚠️</div>
            <h3 id="story-title" style="margin-bottom:15px; text-align:center;">QUEST DATA</h3>
            
            <p id="story-main-text" style="margin-bottom:22px; padding:15px; background:rgba(255,255,255,0.06); border-radius:10px; border-left:4px solid var(--accent-cyan);">
                ストーリーテキストを読み込んでいます...
            </p>
            
            <button class="btn" id="option-1-btn" onclick="makeChoice(1)" style="margin-bottom: 12px; text-align: left; padding-left: 20px;">
                ❶ 選択肢1
            </button>
            <button class="btn" id="option-2-btn" onclick="makeChoice(2)" style="text-align: left; padding-left: 20px;">
                ❷ 選択肢2
            </button>
        </div>
    </div>

    <div id="main-content">
        <div class="glass-panel banner-container">
            <img src="top-banner.png" alt="[ Top Banner ]">
        </div>

        <div class="glass-panel">
            <h2 style="color: var(--accent-cyan); margin-bottom:8px; font-size:1.2rem; text-align:center;">SYSTEM OVERVIEW</h2>
            <p id="main-status-text" style="text-align: center; font-size: 0.9rem;">
                次のスポットの情報をスキャンしてください。
            </p>
        </div>

        <div class="glass-panel">
            <h3 style="font-size:1rem; margin-bottom:12px; text-align:center; color: #fff;">ARCHIVE CHECKPOINT</h3>
            <div class="stamp-grid">
                <div class="stamp-slot" id="slot-1"><span class="stamp-number">01</span></div>
                <div class="stamp-slot" id="slot-2"><span class="stamp-number">02</span></div>
                <div class="stamp-slot" id="slot-3"><span class="stamp-number">03</span></div>
                <div class="stamp-slot" id="slot-4"><span class="stamp-number">04</span></div>
