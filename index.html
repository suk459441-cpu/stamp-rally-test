<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bio-Eco Cyber Scavenger</title>
    <style>
        /* ==========================================================================
           1. Frutiger Aero 全体デザイン (泡とグラデーション)
           ========================================================================== */
        :root {
            --bg-gradient: linear-gradient(135deg, #0077b6 0%, #00b4d8 30%, #52b788 70%, #112211 100%);
            --glass-bg: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.3);
            --text-main: #ffffff;
            --accent-cyan: #00f0ff;
            --biohazard-yellow: #ccff00;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
            overflow-x: hidden;
            position: relative;
        }

        .bubbles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }
        .bubble {
            position: absolute;
            bottom: -50px;
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5), inset 0 0 10px rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: rise 12s infinite linear;
        }
        @keyframes rise {
            0% { transform: translateY(0) scale(1); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-110vh) scale(1.2); opacity: 0; }
        }

        /* ==========================================================================
           2. 共通UIパーツ (Glassmorphism)
           ========================================================================== */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 80, 100, 0.25), inset 0 0 20px rgba(255,255,255,0.1);
            width: 100%;
            max-width: 500px;
            padding: 22px;
            margin-bottom: 20px;
            z-index: 2;
            position: relative;
        }

        h2, h3 {
            font-weight: 600;
            letter-spacing: 0.05em;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        p {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #ffffff;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(180deg, rgba(0,240,255,0.7) 0%, rgba(0,119,182,0.7) 100%);
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 30px;
            color: #fff;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,180,216,0.3), inset 0 2px 4px rgba(255,255,255,0.4);
            text-decoration: none;
        }
        .btn:active, .btn:hover {
            background: linear-gradient(180deg, rgba(0,240,255,0.9) 0%, rgba(0,180,216,0.9) 100%);
            transform: scale(0.98);
        }

        #story-zone, #main-content, #complete-zone {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }

        .biohazard-header {
            color: var(--biohazard-yellow);
            font-size: 0.8rem;
            text-align: center;
            letter-spacing: 0.15em;
            margin-bottom: 12px;
            font-weight: bold;
        }

        .stamp-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .stamp-slot {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: rgba(0, 40, 60, 0.4);
            border: 2px dashed rgba(255,255,255,0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .stamp-slot.active {
            border: 2px solid var(--accent-cyan);
            background: rgba(0, 240, 255, 0.15);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
        }

        .stamp-slot img { width: 85%; height: 85%; object-fit: contain; }
        .stamp-number { font-size: 0.8rem; color: rgba(255,255,255,0.4); font-weight: bold; }

        .notice-box {
            padding: 12px; border-radius: 10px; text-align: center; margin-bottom: 15px;
            font-weight: bold; font-size: 0.9rem; width: 100%; max-width: 500px; z-index: 10;
        }
        .success-notice { background: rgba(82, 183, 136, 0.9); border: 1px solid var(--biohazard-yellow); }
        .error-notice { background: rgba(255, 51, 51, 0.9); border: 1px solid #ff9999; }
        .banner-container { padding: 0; overflow: hidden; border: 1px solid var(--glass-border); }
        .banner-container img { width: 100%; height: auto; display: block; }
    </style>
</head>
<body>

    <div class="bubbles">
        <div class="bubble" style="left: 10%; width: 30px; height: 30px; animation-delay: 0s; animation-duration: 8s;"></div>
        <div class="bubble" style="left: 30%; width: 15px; height: 15px; animation-delay: 2s; animation-duration: 11s;"></div>
        <div class="bubble" style="left: 55%; width: 45px; height: 45px; animation-delay: 1s; animation-duration: 14s;"></div>
        <div class="bubble" style="left: 70%; width: 20px; height: 20px; animation-delay: 5s; animation-duration: 9s;"></div>
        <div class="bubble" style="left: 85%; width: 35px; height: 35px; animation-delay: 3s; animation-duration: 12s;"></div>
    </div>

    <div id="notice-container" style="display: none;"></div>

    <div id="story-zone">
        <div class="glass-panel" style="background: rgba(10, 35, 45, 0.9); border: 2px solid var(--accent-cyan);">
            <div class="biohazard-header">⚠️ MISSION ONGOING ⚠️</div>
            <h3 id="story-title" style="margin-bottom:15px; text-align:center;">QUEST DATA</h3>
            <p id="story-main-text" style="margin-bottom:22px; padding:15px; background:rgba(255,255,255,0.06); border-radius:10px; border-left:4px solid var(--accent-cyan); white-space: pre-wrap;">
                テキスト読み込み中...
            </p>
            <button class="btn" id="option-1-btn" onclick="makeChoice(1)" style="margin-bottom: 12px; text-align: left; padding-left: 20px;">❶ 選択肢1</button>
            <button class="btn" id="option-2-btn" onclick="makeChoice(2)" style="text-align: left; padding-left: 20px;">❷ 選択肢2</button>
        </div>
    </div>

    <div id="main-content">
        <div class="glass-panel banner-container">
            <img src="top-banner.png" alt="[ Top Banner ]">
        </div>
        <div class="glass-panel">
            <h2 style="color: var(--accent-cyan); margin-bottom:8px; font-size:1.2rem; text-align:center;">SYSTEM OVERVIEW</h2>
            <p id="main-status-text" style="text-align: center; font-size: 0.9rem;">ステータスを更新中...</p>
        </div>
        <div class="glass-panel">
            <h3 style="font-size:1rem; margin-bottom:12px; text-align:center;">ARCHIVE CHECKPOINT</h3>
            <div class="stamp-grid">
                <div class="stamp-slot" id="slot-1"><span class="stamp-number">01</span></div>
                <div class="stamp-slot" id="slot-2"><span class="stamp-number">02</span></div>
                <div class="stamp-slot" id="slot-3"><span class="stamp-number">03</span></div>
                <div class="stamp-slot" id="slot-4"><span class="stamp-number">04</span></div>
                <div class="stamp-slot" id="slot-5"><span class="stamp-number">05</span></div>
            </div>
        </div>
    </div>

    <div id="complete-zone">
        <div class="glass-panel" style="border: 2px solid var(--biohazard-yellow); background: rgba(15, 45, 35, 0.95);">
            <div class="biohazard-header">🏁 FINAL ARCHIVE RESTORED 🏁</div>
            <h2 id="ending-title" style="color: var(--biohazard-yellow); margin-bottom:12px; text-align:center;">ENDING</h2>
            <p id="ending-text" style="margin-bottom: 20px; padding: 15px; background:rgba(0,0,0,0.2); border-radius:10px; white-space: pre-wrap;">テキスト</p>
            <div style="background:rgba(255,255,255,0.1); border-radius:12px; overflow:hidden; margin-bottom:20px;">
                <img id="complete-image" src="" alt="[ Ending Reward ]" style="width:100%; height:auto; display:block;">
            </div>
            <button class="btn" onclick="resetGame()" style="background: linear-gradient(180deg, #ff4d4d, #990000);">データを初期化して最初から遊ぶ</button>
        </div>
    </div>

    <script>
        const STAMP_IMAGES = { 1: 'stamp1.PNG', 2: 'stamp2.PNG', 3: 'stamp3.PNG', 4: 'stamp4.PNG', 5: 'stamp5.PNG' };

        // ★ あなたのプロットに基づいた全4問の選択肢
        const STAMP_STORIES = {
            1: { 
                title: "【第1選択】キャンパス潜入の目的", 
                text: "ゾンビが溢れ返ったキャンパス。キリコとブンジと共に中央管理棟へ向かう中、限られたリソースで何から調査すべきか議論になった。\n\nブンジ「ウイルスの発生原因を突き止めなきゃ根本的な解決にゃならねえ！」\nキリコ「いいえ、目の前の生存者を救うために、まずは治療薬のレシピよ！」", 
                opt1: "❶ ゾンビ化の原因を調べる", 
                opt2: "❷ 治療薬の作り方を調べる" 
            },
            2: { 
                title: "【第2選択】突発的バイオハザード", 
                text: "研究棟を捜索中、背後からゾンビの大群がなだれ込んできた！\n脱出する最中、キリコが転倒し、ドアの向こうに取り残されてしまう！\n\nキリコ「キャッ！…私に構わず先に行って！」\nブンジ「おい！アイツを置いていくのか、それともリスクを承知で助けに戻るか！？」", 
                opt1: "❶ キリコを助けに戻る！", 
                opt2: "❷ 苦渋の決断…キリコを置いていく" 
            },
            3: { 
                title: "【第3選択】立ちはだかる感染者たち", 
                text: "ついにメインラボへの道が開けた。しかし、ラボの入り口には、かつてここで研究を行っていたゾンビたちが徘徊している。彼らの生体データは治療薬の完成度に直結しそうだ。\n\nキリコ「彼らを傷つけず、麻酔で拘束して慎重に進めば、完璧なデータが得られるわ！」\nブンジ「甘い！そんな余裕はねえ、倒しながら最短距離で突っ切るぞ！」", 
                opt1: "❶ 麻酔・拘束して進む（完全な治療薬完成へ）", 
                opt2: "❷ 倒しながら進む（不完全な治療薬完成へ）" 
            },
            4: { 
                title: "【第4選択】絶望の感染、そして残された一本", 
                text: "メインラボの最深部で、エラーを起こしたAIシステムが強力なウイルスガスを噴射した！\n必死に防壁を起動したものの、あなたとブンジはガスを吸い込み、感染の初期症状が出始めてしまう。\n手元にある治療薬は……わずか「1人分」だけ。\n\nブンジ「…おい、お前が使え。俺のことはいい…」", 
                opt1: "❶ ブンジに治療薬を使う（ブンジ生存・日記発見）", 
                opt2: "❷ 自分に治療薬を使う（自分生存・ブンジ死亡）" 
            },
            5: {
                title: "【最終決戦】マザーAIとの対峙",
                text: "ウイルスをばら撒き続ける、この都市の環境管理マザーAIが目の前で起動した。\nシステムを完全に停止させなければ未来はない。\nこれまでの全ての行動と選択の結果が、今ここに集約される……。\n\n（※最後のQRコード。ボタンを押すとエンディングへ進みます）",
                opt1: "▶ AIの出力を停止させ、決着をつける",
                opt2: "▶ AIの出力を停止させ、決着をつける"
            }
        };

        // ★ あなたのプロットに基づいた全5種類のマルチエンディング
        const ENDING_DATA = {
            "TRUE": { 
                title: "🏆 TRUE END：『AIの贖罪』", 
                text: "【条件：全員生存／AIの目的判明／AIを倒さない】\n\nブンジに薬を使い、研究者の日記から「AIの真の目的」を知ったあなたたち。キリコも生存し、3人でAIに対峙する。暴走するAIに対し、日記に遺された真実を突きつけると、AIは自らの過ちに気づき、静かに自爆シーケンスを起動した。\nウイルスは完全に消滅。調査団の3人は、屋上に現れた救援ヘリで爽快に青空へと脱出した！", 
                img: "complete-A.png" 
            },
            "GOOD": { 
                title: "✨ GOOD END：『人類の勝利』", 
                text: "【条件：AIの目的判明／AIを破壊】\n\nAIの真の目的は突き止めたものの、キリコやブンジを失った、あるいは対話の道を選ばなかったあなたたち。激しい戦闘の末、暴走するマザーAIのコアを完全に破壊した！\nかくして事件は解決しパンデミックは収束したが、AIが遺した不穏な真相は、生き残った者たちの心に深く重く残り続ける……。", 
                img: "complete-A.png" 
            },
            "NORMAL": { 
                title: "🏃‍♂️ NORMAL END：『治療薬』", 
                text: "【条件：完全な治療薬完成／AIを倒せない】\n\nAIの目的は不明のまま、あるいはAIを止めることはできなかった。しかし、道中で完成させた「完全な治療薬」のデータを死守することには成功する。\nあなたたちは治療法を確立したまま、ヘリで無事にキャンパスを脱出した。人類には大いなる希望が残された。……だが、AIは今でもあの廃墟で、静かにゾンビを増やし続けている。", 
                img: "complete-B.png" 
            },
            "BAD": { 
                title: "💀 BAD END：『感染』", 
                text: "【条件：不完全な治療薬、またはAIとの戦闘に敗北】\n\n手に入れたのは不完全な治療薬だった。あるいは、自分に薬を使ったことで孤立し、狂いゆくシステムに敗北してしまった。\nウイルスの浸食が体を蝕んでいく。あなたたちは力尽き、キリコとブンジも次々とゾンビ化していった……。\n遠のく記憶。約束されなかった未来の虚無だけが、そこに残された。", 
                img: "complete-B.png" 
            },
            "WORST": { 
                title: "🚨 WORST END：『人類ゾンビ化計画』", 
                text: "【条件：AIを止められず、治療薬も完成しない】\n\n最悪の選択が重なり、治療薬のレシピは霧散し、マザーAIの暴走を止める術は完全に失われた。\nAIは世界に向けて、潜伏性の高い新型ウイルスを大気中へ一斉に拡散し始める。\n──数ヶ月後、人類は滅亡。地球には、死ぬことも腐ることもない、永遠に彷徨う不死のゾンビだけが残された。", 
                img: "complete-B.png" 
            }
        };

        let gameState = { currentStep: 0, collectedSpots: [], choices: {} };

        window.addEventListener('DOMContentLoaded', () => {
            try {
                const savedSpots = localStorage.getItem('v4_z_spots');
                const savedChoices = localStorage.getItem('v4_z_choices');
                const savedStep = localStorage.getItem('v4_z_step');

                if (savedSpots) gameState.collectedSpots = JSON.parse(savedSpots);
                if (savedChoices) gameState.choices = JSON.parse(savedChoices);
                if (savedStep) gameState.currentStep = parseInt(savedStep, 10);
            } catch (e) {
                localStorage.clear();
                gameState = { currentStep: 0, collectedSpots: [], choices: {} };
            }

            processUrlParameter();
            updateScreen();
        });

        function saveStorage() {
            try {
                localStorage.setItem('v4_z_spots', JSON.stringify(gameState.collectedSpots));
                localStorage.setItem('v4_z_choices', JSON.stringify(gameState.choices));
                localStorage.setItem('v4_z_step', gameState.currentStep.toString());
            } catch (e) {}
        }

        function processUrlParameter() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const spotParam = urlParams.get('spot');
                const noticeContainer = document.getElementById('notice-container');
                if (!noticeContainer) return;

                if (spotParam) {
                    const spotNum = parseInt(spotParam, 10);
                    if (spotNum >= 1 && spotNum <= 5) {
                        if (gameState.collectedSpots.includes(spotNum)) return;

                        const expectedNext = gameState.collectedSpots.length + 1;

                        if (spotNum === expectedNext) {
                            gameState.collectedSpots.push(spotNum);
                            saveStorage();
                            noticeContainer.innerHTML = `<div class="notice-box success-notice">▶ CHECK-IN SUCCESS: スポット 0${spotNum} 接続完了</div>`;
                            noticeContainer.style.display = 'block';
                        } else {
                            noticeContainer.innerHTML = `<div class="notice-box error-notice">❌ アクセス拒否: スポット 0${expectedNext} のデータを先に修復してください。</div>`;
                            noticeContainer.style.display = 'block';
                        }
                    }
                }
            } catch(err) { console.error(err); }
        }

        function makeChoice(optionNumber) {
            try {
                const currentQuestionId = gameState.collectedSpots.length;
                if (currentQuestionId === 0) return;

                gameState.choices[currentQuestionId] = optionNumber;
                gameState.currentStep = currentQuestionId;
                saveStorage();

                const noticeContainer = document.getElementById('notice-container');
                if (noticeContainer) noticeContainer.style.display = 'none';
                
                window.history.replaceState({}, document.title, window.location.pathname);
                updateScreen();
            } catch(e) { resetGame(); }
        }

        function updateScreen() {
            const storyZone = document.getElementById('story-zone');
            const mainContent = document.getElementById('main-content');
            const completeZone = document.getElementById('complete-zone');

            if (!storyZone || !mainContent || !completeZone) return;

            const totalCollected = gameState.collectedSpots.length;

            if (totalCollected > gameState.currentStep) {
                const storyData = STAMP_STORIES[totalCollected];
                if (storyData) {
                    document.getElementById('story-title').innerText = storyData.title;
                    document.getElementById('story-main-text').innerText = storyData.text;
                    document.getElementById('option-1-btn').innerText = storyData.opt1;
                    document.getElementById('option-2-btn').innerText = storyData.opt2;

                    storyZone.style.display = 'flex';
                    mainContent.style.display = 'none';
                    completeZone.style.display = 'none';
                    return;
                }
            }

            if (totalCollected === 5 && gameState.currentStep === 5) {
                determineEnding();
                storyZone.style.display = 'none';
                mainContent.style.display = 'none';
                completeZone.style.display = 'flex';
                return;
            }

            storyZone.style.display = 'none';
            mainContent.style.display = 'flex';
            completeZone.style.display = 'none';

            const statusTextEl = document.getElementById('main-status-text');
            if (statusTextEl) {
                if (totalCollected === 0) {
                    statusTextEl.innerText = "【作戦開始】まずは最初のターゲット：スポット01のQRコードをスキャンしてください。";
                } else {
                    statusTextEl.innerText = `選択完了。次はスポット0${totalCollected + 1}のQRコードを探してください。`;
                }
            }

            for (let i = 1; i <= 5; i++) {
                const slot = document.getElementById(`slot-${i}`);
                if (slot) {
                    if (gameState.collectedSpots.includes(i)) {
                        slot.classList.add('active');
                        slot.innerHTML = `<img src="${STAMP_IMAGES[i]}" alt="Stamp ${i}">`;
                    } else {
                        slot.classList.remove('active');
                        slot.innerHTML = `<span class="stamp-number">0${i}</span>`;
                    }
                }
            }
        }

        // ==========================================================================
        // 🧠 ★天才エンジニアの条件判定アルゴリズム (プロットを完全再現)
        // ==========================================================================
        function determineEnding() {
            // 各選択肢の回答を取得 (1 = ❶の選択肢, 2 = ❷の選択肢)
            const choice1 = gameState.choices[1]; // 1:原因調査, 2:治療薬レシピ
            const choice2 = gameState.choices[2]; // 1:キリコ助ける, 2:置いていく
            const choice3 = gameState.choices[3]; // 1:麻酔・拘束(完全), 2:倒す(不完全)
            const choice4 = gameState.choices[4]; // 1:ブンジに使う(日記発見), 2:自分に使う(不明)

            // フラグの初期化
            let isAllAlive = false;       // 全員生存フラグ
            let knowAIPurpose = false;    // AIの目的判明フラグ
            let isPerfectCure = false;    // 完全な治療薬フラグ

            // 1. 治療薬の完成度判定 (第3選択)
            if (choice3 === 1) {
                isPerfectCure = true;
            }

            // 2. AIの目的判明判定 (第4選択でブンジに薬を使うと日記発見)
            if (choice4 === 1) {
                knowAIPurpose = true;
            }

            // 3. 全員生存判定 (キリコを助け、かつブンジに薬を使って自分が耐えきった場合)
            if (choice2 === 1 && choice4 === 1) {
                isAllAlive = true;
            }

            // --- 運命のエンディング判定 ---
            let finalEndKey = "WORST"; // デフォルト

            if (isAllAlive && knowAIPurpose) {
                // ◆全員生存していて、目的も知っている ➔ 対話が可能になり、AIを倒さず自爆させる【TRUE END】
                finalEndKey = "TRUE";
            } 
            else if (knowAIPurpose && !isAllAlive) {
                // ◆AIの目的は知ったが、誰かが欠けている ➔ 対話が成立せず、力ずくでAIを破壊する【GOOD END】
                finalEndKey = "GOOD";
            } 
            else if (isPerfectCure && !knowAIPurpose) {
                // ◆完全な治療薬はあるが、AIの目的は不明（日記未発見）➔ AIを倒せず生存させてしまう【NORMAL END】
                finalEndKey = "NORMAL";
            } 
            else if (!isPerfectCure && choice4 === 2) {
                // ◆不完全な治療薬、または自分に薬を使ってブンジ死亡（AIとの戦闘敗北扱い）【BAD END】
                finalEndKey = "BAD";
            } 
            else {
                // ◆治療薬も完成せず、AIも止められない【WORST END】
                finalEndKey = "WORST";
            }

            // 画面への反映
            const finalEnd = ENDING_DATA[finalEndKey];
            if (finalEnd) {
                document.getElementById('ending-title').innerText = finalEnd.title;
                document.getElementById('ending-text').innerText = finalEnd.text;
                document.getElementById('complete-image').src = finalEnd.img;
            }
        }

        function resetGame() {
            localStorage.clear();
            window.location.href = window.location.pathname;
        }
    </script>
</body>
</html>
